# 默认配置（请勿直接修改）。
# 建议复制到 config/user/site.yml 并按需调整；用户配置采用“完全替换”策略，将覆盖默认配置。

title: MeNav
description: Personal Navigation Station
author: rbetree
favicon: menav.svg
logo_text: MeNav
icons:
  mode: favicon
  region: cn
security:
  allowedSchemes:
    - http
    - https
    - mailto
    - tel
theme:
  mode: dark
fonts:
  source: css
  cssUrl: https://fontsapi.zeoseven.com/292/main/result.css
  preload: true
  family: LXGW WenKai
  weight: normal
profile:
  title: Hello,
  subtitle: Welcome to My Navigation
rss:
  enabled: true
  cacheDir: dev
  fetch:
    timeoutMs: 10000
    totalTimeoutMs: 60000
    concurrency: 5
    maxRetries: 1
    maxRedirects: 3
  articles:
    perSite: 8
    total: 50
    summaryMaxLength: 200
github:
  username: rbetree
  heatmapColor: 37b24d
  cacheDir: dev
social:
  - name: GitHub
    url: https://github.com
    icon: fab fa-github
  - name: Telegram
    url: https://t.me
    icon: fab fa-telegram
  - name: Twitter
    url: https://twitter.com
    icon: fab fa-twitter
  - name: Steam
    url: https://steam.com
    icon: fab fa-steam
navigation:
  - name: 常用
    icon: fas fa-star
    id: common
  - name: 项目
    icon: fas fa-project-diagram
    id: projects
  - name: 文章
    icon: fas fa-book
    id: articles
  - name: 书签
    icon: fas fa-bookmark
    id: bookmarks
  - name: 关于
    icon: fas fa-file-alt
    id: content
  - name: '1'
    icon: fas
    id: '1'
